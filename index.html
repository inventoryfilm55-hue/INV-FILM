    <style>
      :root {
        --bg-color: #080808;
        --bg-gradient: radial-gradient(circle at 50% -20%, #1a1a1a 0%, #050505 100%);
        --accent-lime: #84cc16;
      }
      
      body {
        font-family: 'Outfit', sans-serif;
        background: var(--bg-color);
        background: var(--bg-gradient);
        background-attachment: fixed;
        color: #ffffff;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }

      .grain-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('https://grainy-gradients.vercel.app/noise.svg');
        opacity: 0.05;
        pointer-events: none;
        z-index: 9999;
      }

      .font-logo { font-family: 'Syne', sans-serif; letter-spacing: -0.04em; text-transform: uppercase; }
      .font-heading { font-family: 'Syne', sans-serif; line-height: 0.85; text-transform: uppercase; }

      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #050505;
      }
      #root:empty::after {
        content: 'INV FILM';
        font-family: 'Syne', sans-serif;
        font-weight: 900;
        font-size: 2.5rem;
        letter-spacing: 0.5em;
        color: rgba(255,255,255,0.2);
        animation: loading-pulse 1.5s infinite ease-in-out;
      }
      @keyframes loading-pulse {
        0%, 100% { opacity: 0.2; transform: scale(0.98); filter: blur(2px); }
        50% { opacity: 0.5; transform: scale(1); filter: blur(0px); }
      }

      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-10px); }
        40%, 80% { transform: translateX(10px); }
      }
      .animate-shake { animation: shake 0.5s ease-in-out; }

      /* Custom Scrollbar */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #050505; }
      ::-webkit-scrollbar-thumb { background: #222; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--accent-lime); }
    </style>
